<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Task Scheduler</title>
</head>

<body>

        <style>
        body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }

            header {
                color: white;
                text-align: center;
                padding: 1rem 0;
            }

            main {
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
            }

            .task-form {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }

            .task-list {
                border: 1px solid #ddd;
                padding: 10px;
            }

            .task {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
                padding: 5px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            .task button {
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 3px;
                cursor: pointer;
            }
        </style>
    <header>
        <h1>Tâches</h1>
        
        <a href="{{ url_for('index.html') }}" class="btn-menu">Tâches</a>

         <a href="index.html"><i class="material-icons">home</i></a> 
        <img src="home.png"> 
    </header>
    <main>
        <div class="task-form">
            <input type="text" id="task" placeholder="Enter task...">
            <select id="priority">
                <option value="top">Priorité haute</option>
                <option value="middle">Priorité moyenne</option>
                <option value="low">Priorité basse</option>
            </select>
            <input type="date" id="deadline">
            <button id="add-task">Ajouter une tâche</button>
        </div>
        <div class="task-list" id="task-list">
            <!-- Tasks will be added here dynamically -->
        </div>
        <!-- <script src="logic.js"></script>-->
        <script>
        const taskInput = document.getElementById("task");
        const priorityInput = document.getElementById("priority");
        const deadlineInput = document.getElementById("deadline");
        const addTaskButton = document.getElementById("add-task");
        const taskList = document.getElementById("task-list");

        addTaskButton.addEventListener("click", () => {
            const task = taskInput.value;
            const priority = priorityInput.value;
            const deadline = deadlineInput.value;
            if (task.trim() === "" || deadline === "") {
                alert("Please select an upcoming date for the deadline.")
                return; // Don't add task if task or deadline is empty
            }

            const selectedDate = new Date(deadline);
            const currentDate = new Date();

            if (selectedDate <= currentDate) {
                alert("Please select an upcoming date for the deadline.");
                return; // Don't add task if deadline is not in the future
            }


            const taskItem = document.createElement("div");
            taskItem.classList.add("task");
            taskItem.innerHTML = `
            <p>${task}</p>
            <p>Priority: ${priority}</p>
            <p>Deadline: ${deadline}</p>
            <button class="mark-done">Mark Done</button>
        `;

            taskList.appendChild(taskItem);

            taskInput.value = "";
            priorityInput.value = "top";
            deadlineInput.value = "";
        });

        taskList.addEventListener("click", (event) => {
            if (event.target.classList.contains("mark-done")) {
                const taskItem = event.target.parentElement;
                taskItem.style.backgroundColor = "#f2f2f2";
                event.target.disabled = true;
            }
        });
        </script>
    </main>

</body>
</html>
