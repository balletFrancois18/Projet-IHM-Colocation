<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — ColocApp</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">🏠</div>
      <h1>ColocApp</h1>
      <p>Gérez votre colocation simplement</p>
    </div>
    <div class="card">
      <h2>Créer un compte</h2>
      <p class="subtitle">Rejoignez votre colocation en quelques secondes</p>
      <form method="POST">
        <div class="row">
          <div class="field">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" placeholder="Marie" required>
          </div>
          <div class="field">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="Dupont" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" href="login.html">Créer mon compte</button>
      </form>
      <div class="link">
        Déjà un compte ?
        <a href="login.html">Se connecter</a>
      </div>
    </div>
  </div>
</body>
</html>
