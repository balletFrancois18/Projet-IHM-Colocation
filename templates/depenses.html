<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoLoc — Dépenses</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #F6F8FC; }

    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; background: white;
      border-bottom: 1px solid #E5E7EB;
    }
    .nav-logo { font-size: 22px; font-weight: 800; }
    .nav-logo span { color: #5B6CFF; }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a { text-decoration: none; color: #6B7280; font-weight: 500; font-size: 14px; }
    .nav-links a:hover { color: #5B6CFF; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .btn-profil {
      padding: 8px 16px; background: #5B6CFF; color: white;
      border: none; border-radius: 10px; cursor: pointer; font-size: 13px;
    }
    .btn-logout {
      padding: 8px 16px; background: white; color: #6B7280;
      border: 1px solid #E5E7EB; border-radius: 10px;
      cursor: pointer; font-size: 13px; text-decoration: none;
    }

    .container { max-width: 900px; margin: 40px auto; padding: 0 24px; }

    /* Pot commun */
    .pot-commun {
      text-align: center; font-size: 20px; font-weight: 700;
      margin-bottom: 32px; color: #111827;
    }
    .pot-commun span { color: #5B6CFF; }

    /* Card catégorie */
    .categorie-card {
      background: white; border-radius: 16px;
      padding: 20px 24px; margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .categorie-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 12px;
    }
    .categorie-titre { font-size: 14px; font-weight: 600; color: #374151; }

    /* Barre de répartition colorée */
    .barre-repartition {
      display: flex; height: 14px; border-radius: 20px;
      overflow: hidden; flex: 1; margin: 0 16px;
    }
    .barre-segment { height: 100%; }

    /* Boutons action */
    .categorie-actions { display: flex; gap: 8px; }
    .btn-action {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1.5px solid #E5E7EB; background: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px; color: #6B7280;
      transition: all 0.2s;
    }
    .btn-action:hover { border-color: #5B6CFF; color: #5B6CFF; }

    /* Champ courses vide */
    .courses-input {
      width: 60%; padding: 10px 14px;
      border: 1.5px solid #E5E7EB; border-radius: 10px;
      font-size: 13px; color: #6B7280; background: white;
    }

    /* Modal ajout/modification */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.3); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white; border-radius: 16px;
      padding: 28px; width: 360px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }
    .modal-titre { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #374151; }
    .modal-input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #E5E7EB; border-radius: 10px;
      font-size: 13px; margin-bottom: 12px;
    }
    .modal-input:focus { outline: none; border-color: #5B6CFF; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .btn-valider {
      padding: 8px 18px; background: #5B6CFF; color: white;
      border: none; border-radius: 10px; cursor: pointer; font-size: 13px;
    }
    .btn-annuler {
      padding: 8px 18px; background: white; color: #6B7280;
      border: 1.5px solid #E5E7EB; border-radius: 10px;
      cursor: pointer; font-size: 13px;
    }
  </style>
</head>
<body>

  

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-logo">Co<span>Loc</span></div>
  <div class="nav-links">
    <a href="{{ url_for('index') }}">Accueil</a>
    <a href="{{ url_for('taches.liste_taches') }}">Tâches</a>
    <a href="{{ url_for('depenses.liste_depenses') }}">Dépenses</a>
  </div>
  <div class="nav-right">
    <div>👤</div>
    <button class="btn-profil">Profil</button>
    <a href="{{ url_for('auth.logout') }}" class="btn-logout">Déconnexion</a>
  </div>
</nav>


<div class="container">

  <!-- Pot commun -->
  <div class="pot-commun">
    Montant Pot Commun : <span>{{ total }} €</span>
  </div>

  <!-- Répartition loyer -->
  <div class="categorie-card">
    <div class="categorie-header">
      <span class="categorie-titre">Répartition loyer</span>
      <div class="barre-repartition">
        <div class="barre-segment" style="width:40%;background:#F59E0B"></div>
        <div class="barre-segment" style="width:35%;background:#5B6CFF"></div>
        <div class="barre-segment" style="width:25%;background:#34D399"></div>
      </div>
      <div class="categorie-actions">
        <button class="btn-action" onclick="ouvrirModal('modifier')">✏️</button>
        <button class="btn-action" onclick="ouvrirModal('ajouter')">＋</button>
      </div>
    </div>
  </div>


  {% for depense in depenses %}
<div class="categorie-card">
  <div class="categorie-header">
    <span class="categorie-titre">{{ depense.titre }}</span>
    <div class="categorie-actions">
      <span style="font-size:13px;font-weight:600;color:#5B6CFF;margin-right:8px">
        {{ depense.montant }} €
      </span>

      <!-- Bouton modifier — ouvre le modal avec les données pré-remplies -->
      <button class="btn-action"
        onclick="ouvrirModalModifier({{ depense.id }}, '{{ depense.titre }}', {{ depense.montant }}, '{{ depense.payeur }}')">
        ✏️
      </button>

      <!-- Bouton supprimer -->
      <a href="{{ url_for('depenses.supprimer_depense', id=depense.id) }}"
         class="btn-action"
         onclick="return confirm('Supprimer cette dépense ?')">
        ✕
      </a>
    </div>
  </div>
  <div style="font-size:12px;color:#6B7280;margin-top:4px">
    Payé par <strong>{{ depense.payeur }}</strong>
  </div>
</div>
{% endfor %}




<form method="POST" id="modal-form">
  <input type="text"   id="input-titre"   name="titre"   class="modal-input" placeholder="Titre" required>
  <input type="number" id="input-montant" name="montant" class="modal-input" placeholder="Montant €" step="0.01" required>
  <input type="text"   id="input-payeur"  name="payeur"  class="modal-input" placeholder="Qui a payé ?" required>
  <div class="modal-actions">
    <button type="button" class="btn-annuler" onclick="fermerModal()">Annuler</button>
    <button type="submit" class="btn-valider">✓ Valider</button>
  </div>
</form>
