
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoLoc — Dépenses</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #5B6CFF;
      --bg: #F6F8FC;
      --surface: #fff;
      --border: #E5E7EB;
      --text: #111827;
      --muted: #6B7280;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0,0,0,0.07);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .nav-logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; }
    .nav-logo span { color: var(--primary); }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a {
      text-decoration: none; color: var(--muted);
      font-weight: 500; font-size: 14px; transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--primary); }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .btn-sm {
      padding: 8px 16px; border-radius: 10px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-ghost { background: white; color: var(--muted); border: 1.5px solid var(--border); text-decoration: none; display: inline-flex; align-items: center; }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

    /* CONTAINER */
    .container { max-width: 860px; margin: 36px auto; padding: 0 24px; }

    /* POT COMMUN */
    .pot-header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border-radius: var(--radius);
      padding: 20px 28px; margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .pot-label { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
    .pot-montant {
      font-family: 'Syne', sans-serif; font-size: 28px;
      font-weight: 800; color: var(--primary);
    }
    .btn-edit-pot {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 8px 14px;
      font-size: 12px; color: var(--muted); cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-edit-pot:hover { border-color: var(--primary); color: var(--primary); }

    /* CATEGORIE CARD */
    .categorie-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 22px 26px; margin-bottom: 14px;
      box-shadow: var(--shadow); border: 1.5px solid transparent;
      transition: border-color 0.2s;
    }
    .categorie-card:hover { border-color: rgba(91,108,255,0.15); }

    .cat-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 16px;
    }
    .cat-titre {
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 700;
    }
    .cat-actions { display: flex; gap: 8px; }
    .btn-round {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1.5px solid var(--border); background: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 14px; color: var(--muted);
      transition: all 0.2s;
    }
    .btn-round:hover { border-color: var(--primary); color: var(--primary); background: #EEF2FF; }

    /* BARRE DE RÉPARTITION */
    .barre-wrap { position: relative; margin-bottom: 8px; }
    .barre {
      display: flex; height: 18px; border-radius: 20px;
      overflow: visible; background: var(--border);
      position: relative;
    }
    .barre-segment {
      height: 100%; transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
      position: relative; cursor: pointer;
    }
    .barre-segment:first-child { border-radius: 20px 0 0 20px; }
    .barre-segment:last-child { border-radius: 0 20px 20px 0; }
    .barre-segment:only-child { border-radius: 20px; }

    /* Tooltip au survol */
    .barre-segment .tooltip {
      position: absolute; bottom: calc(100% + 8px);
      left: 50%; transform: translateX(-50%);
      background: #1F2937; color: white;
      padding: 5px 10px; border-radius: 8px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .barre-segment .tooltip::after {
      content: ''; position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #1F2937;
    }
    .barre-segment:hover .tooltip { opacity: 1; }

    /* Légende */
    .barre-legende {
      display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
    }
    .legende-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted);
    }
    .legende-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .legende-nom { font-weight: 600; color: var(--text); }

    /* Champ courses */
    .courses-row {
      display: flex; gap: 10px; align-items: center; margin-top: 4px;
    }
    .courses-input {
      flex: 1; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 13px; font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s;
    }
    .courses-input:focus { outline: none; border-color: var(--primary); }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.35); z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white; border-radius: 20px;
      padding: 28px; width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-titre {
      font-family: 'Syne', sans-serif;
      font-size: 18px; font-weight: 700; margin-bottom: 20px;
    }
    .field-group { margin-bottom: 14px; }
    .field-label {
      font-size: 12px; font-weight: 600; color: var(--muted);
      margin-bottom: 5px; display: block; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field-input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 13px; font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s;
    }
    .field-input:focus { outline: none; border-color: var(--primary); }
    .modal-actions {
      display: flex; justify-content: flex-end;
      gap: 10px; margin-top: 20px;
    }
    .btn-valider {
      padding: 10px 22px; background: var(--primary); color: white;
      border: none; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .btn-valider:hover { background: #4455EE; transform: scale(1.02); }
    .btn-annuler {
      padding: 10px 18px; background: white; color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 10px;
      cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .btn-annuler:hover { border-color: #EF4444; color: #EF4444; }

    /* Modal pot commun */
    .pot-input {
      width: 100%; padding: 14px; font-size: 24px; font-weight: 700;
      text-align: center; border: 2px solid var(--border);
      border-radius: 12px; font-family: 'Syne', sans-serif;
      color: var(--primary); transition: border-color 0.2s;
    }
    .pot-input:focus { outline: none; border-color: var(--primary); }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">Co<span>Loc</span></div>
  <div class="nav-links">
    <a href="{{ url_for('index') }}">🏠 Accueil</a>
    <a href="{{ url_for('taches.liste_taches') }}">🧹 Tâches</a>
    <a href="{{ url_for('depenses.liste_depenses') }}" class="active">💸 Dépenses</a>
  </div>
  <div class="nav-right">
    <span>👤</span>
    <button class="btn-sm btn-primary">Profil</button>
    <a href="{{ url_for('auth.logout') }}" class="btn-sm btn-ghost">Déconnexion</a>
  </div>
</nav>

<div class="container">

  <!-- Pot commun -->
  <div class="pot-header">
    <div>
      <div class="pot-label">Montant Pot Commun</div>
      <div class="pot-montant" id="affichage-total">{{ total }} €</div>
    </div>
    <button class="btn-edit-pot" onclick="ouvrirModalPot()">✏️ Modifier</button>
  </div>

  <!-- Répartition loyer -->
  <div class="categorie-card" id="cat-loyer">
    <div class="cat-header">
      <span class="cat-titre">🏠 Répartition loyer</span>
      <div class="cat-actions">
        <button class="btn-round" onclick="ouvrirModalModifier('loyer')" title="Modifier">✏️</button>
        <button class="btn-round" onclick="ouvrirModalAjouter('loyer')" title="Ajouter">＋</button>
      </div>
    </div>
    <div class="barre-wrap">
      <div class="barre" id="barre-loyer"></div>
    </div>
    <div class="barre-legende" id="legende-loyer"></div>
  </div>

  <!-- Activité principale -->
  <div class="categorie-card" id="cat-activite">
    <div class="cat-header">
      <span class="cat-titre">⚡ Activité principale</span>
      <div class="cat-actions">
        <button class="btn-round" onclick="ouvrirModalModifier('activite')" title="Modifier">✏️</button>
        <button class="btn-round" onclick="ouvrirModalAjouter('activite')" title="Ajouter">＋</button>
      </div>
    </div>
    <div class="barre-wrap">
      <div class="barre" id="barre-activite"></div>
    </div>
    <div class="barre-legende" id="legende-activite"></div>
  </div>

  <!-- Courses -->
  <div class="categorie-card" id="cat-courses">
    <div class="cat-header">
      <span class="cat-titre">🛒 Courses</span>
      <div class="cat-actions">
        <button class="btn-round" onclick="ouvrirModalModifier('courses')" title="Modifier">✏️</button>
        <button class="btn-round" onclick="ouvrirModalAjouter('courses')" title="Ajouter">＋</button>
      </div>
    </div>
    <div class="barre-wrap">
      <div class="barre" id="barre-courses"></div>
    </div>
    <div class="barre-legende" id="legende-courses"></div>
    <div class="courses-row" style="margin-top:14px">
      <input type="text" class="courses-input" id="input-courses" placeholder="Ajouter un article...">
      <button class="btn-sm btn-primary" onclick="ajouterArticle()">＋</button>
    </div>
    <div id="liste-articles" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>

</div>

<!-- Modal ajouter/modifier participant -->
<div class="modal-overlay" id="modal-participant">
  <div class="modal">
    <div class="modal-titre" id="modal-titre-participant">Ajouter un participant</div>
    <input type="hidden" id="modal-categorie">
    <input type="hidden" id="modal-index-modifier" value="-1">
    <div class="field-group">
      <label class="field-label">Nom</label>
      <input type="text" class="field-input" id="input-nom" placeholder="ex: Dorian">
    </div>
    <div class="field-group">
      <label class="field-label">Montant (€)</label>
      <input type="number" class="field-input" id="input-montant" placeholder="ex: 20" step="0.01" min="0">
    </div>
    <div class="modal-actions">
      <button class="btn-annuler" onclick="fermerModal('modal-participant')">✕ Annuler</button>
      <button class="btn-valider" onclick="validerParticipant()">✓ Valider</button>
    </div>
  </div>
</div>

<!-- Modal modifier pot commun -->
<div class="modal-overlay" id="modal-pot">
  <div class="modal">
    <div class="modal-titre">Modifier le pot commun</div>
    <div class="field-group">
      <label class="field-label">Montant total (€)</label>
      <input type="number" class="pot-input" id="input-pot" placeholder="2800" step="0.01" min="0">
    </div>
    <div class="modal-actions">
      <button class="btn-annuler" onclick="fermerModal('modal-pot')">✕ Annuler</button>
      <button class="btn-valider" onclick="validerPot()">✓ Valider</button>
    </div>
  </div>
</div>

<script>
// Couleurs pour les participants
const COULEURS = [
  '#F59E0B', '#5B6CFF', '#34D399', '#FF7A59',
  '#A78BFA', '#EC4899', '#14B8A6', '#F97316'
];


// Structure des catégories
const categories = {
  loyer:    { participants: [] },
  activite: { participants: [] },
  courses:  { participants: [] }
};

// Remplir avec les données Flask si disponibles
donneesFlask.forEach(d => {
  const cat = d.categorie || 'courses';
  if (categories[cat]) {
    categories[cat].participants.push({
      nom: d.payeur,
      montant: d.montant
    });
  }
});

// Si pas de données Flask, mettre des exemples
if (categories.loyer.participants.length === 0) {
  categories.loyer.participants    = [{nom:'Simon', montant:400},{nom:'Lola', montant:400},{nom:'Dorian', montant:400}];
  categories.activite.participants = [{nom:'Simon', montant:50},{nom:'Lola', montant:80}];
  categories.courses.participants  = [];
}

let potCommun = {{ total }} || 2800;

// ─── RENDU DES BARRES ────────────────────────────────────────────

function rendreBarre(categorie) {
  const data  = categories[categorie];
  const barre = document.getElementById('barre-' + categorie);
  const legende = document.getElementById('legende-' + categorie);

  if (!barre || !legende) return;

  const total = data.participants.reduce((s, p) => s + p.montant, 0);

  barre.innerHTML   = '';
  legende.innerHTML = '';

  if (total === 0) {
    barre.style.background = '#E5E7EB';
    legende.innerHTML = '<span style="font-size:12px;color:#9CA3AF">Aucun participant</span>';
    return;
  }

  barre.style.background = 'transparent';

  data.participants.forEach((p, i) => {
    const pct     = (p.montant / total * 100).toFixed(1);
    const couleur = COULEURS[i % COULEURS.length];

    // Segment de barre
    const seg = document.createElement('div');
    seg.className = 'barre-segment';
    seg.style.width      = pct + '%';
    seg.style.background = couleur;

    // Tooltip au survol
    const tip = document.createElement('div');
    tip.className   = 'tooltip';
    tip.textContent = p.nom + ' — ' + p.montant + ' €';
    seg.appendChild(tip);

    // Arrondir les coins
    if (i === 0) seg.style.borderRadius = '20px 0 0 20px';
    if (i === data.participants.length - 1) seg.style.borderRadius = '0 20px 20px 0';
    if (data.participants.length === 1) seg.style.borderRadius = '20px';

    barre.appendChild(seg);

    // Légende
    const item = document.createElement('div');
    item.className = 'legende-item';
    item.innerHTML = `
      <div class="legende-dot" style="background:${couleur}"></div>
      <span class="legende-nom">${p.nom}</span>
      <span>${p.montant} €</span>
    `;
    legende.appendChild(item);
  });
}

function rendreToutes() {
  ['loyer', 'activite', 'courses'].forEach(rendreBarre);
  mettreAJourTotal();
}

// ─── TOTAL POT COMMUN ────────────────────────────────────────────

function mettreAJourTotal() {
  document.getElementById('affichage-total').textContent = potCommun + ' €';
}

// ─── MODALS ──────────────────────────────────────────────────────

function ouvrirModalAjouter(categorie) {
  document.getElementById('modal-titre-participant').textContent = 'Ajouter un participant';
  document.getElementById('modal-categorie').value  = categorie;
  document.getElementById('modal-index-modifier').value = -1;
  document.getElementById('input-nom').value     = '';
  document.getElementById('input-montant').value = '';
  document.getElementById('modal-participant').classList.add('active');
  document.getElementById('input-nom').focus();
}

function ouvrirModalModifier(categorie) {
  const data = categories[categorie];
  if (data.participants.length === 0) {
    ouvrirModalAjouter(categorie);
    return;
  }
  // Modifier le dernier participant par défaut
  const idx = data.participants.length - 1;
  const p   = data.participants[idx];
  document.getElementById('modal-titre-participant').textContent = 'Modifier ' + p.nom;
  document.getElementById('modal-categorie').value  = categorie;
  document.getElementById('modal-index-modifier').value = idx;
  document.getElementById('input-nom').value     = p.nom;
  document.getElementById('input-montant').value = p.montant;
  document.getElementById('modal-participant').classList.add('active');
}

function validerParticipant() {
  const categorie = document.getElementById('modal-categorie').value;
  const idx       = parseInt(document.getElementById('modal-index-modifier').value);
  const nom       = document.getElementById('input-nom').value.trim();
  const montant   = parseFloat(document.getElementById('input-montant').value);

  if (!nom || isNaN(montant) || montant < 0) {
    alert('Remplis bien le nom et le montant !');
    return;
  }

  if (idx === -1) {
    // Ajouter
    categories[categorie].participants.push({ nom, montant });
  } else {
    // Modifier
    categories[categorie].participants[idx] = { nom, montant };
  }

  fermerModal('modal-participant');
  rendreBarre(categorie);
}

function ouvrirModalPot() {
  document.getElementById('input-pot').value = potCommun;
  document.getElementById('modal-pot').classList.add('active');
  document.getElementById('input-pot').focus();
  document.getElementById('input-pot').select();
}

function validerPot() {
  const val = parseFloat(document.getElementById('input-pot').value);
  if (!isNaN(val) && val >= 0) {
    potCommun = val;
    mettreAJourTotal();
  }
  fermerModal('modal-pot');
}

function fermerModal(id) {
  document.getElementById(id).classList.remove('active');
}

// Fermer en cliquant dehors
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });
});

// Entrée = valider
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
  }
});

// ─── ARTICLES COURSES ────────────────────────────────────────────

function ajouterArticle() {
  const input = document.getElementById('input-courses');
  const val   = input.value.trim();
  if (!val) return;

  const tag = document.createElement('span');
  tag.style.cssText = `
    background:#EEF2FF; color:#5B6CFF; padding:4px 12px;
    border-radius:20px; font-size:12px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
  `;
  tag.innerHTML = val + ' <span style="cursor:pointer;opacity:0.6" onclick="this.parentElement.remove()">✕</span>';
  document.getElementById('liste-articles').appendChild(tag);
  input.value = '';
  input.focus();
}

document.getElementById('input-courses').addEventListener('keydown', e => {
  if (e.key === 'Enter') ajouterArticle();
});

// ─── INIT ─────────────────────────────────────────────────────────
rendreToutes();
</script>

</body>
</html>
