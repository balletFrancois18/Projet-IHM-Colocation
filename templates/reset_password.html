<!DOCTYPE html> 
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="container">
        <div class="logo">
         <div class="logo-box">Co<span>Loc</span></div>
         <p>Gérez votre colocation simplement</p>
        </div>
        <div class="card">
            <h2>Réinitialiser le mot de passe</h2>
            <p class="subtitle">Entrez votre adresse e-mail pour recevoir un lien de réinitialisation</p>
            <form method="POST">
                <div class="field">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
                </div>
                <button type="submit" class="btn" mailto>Envoyer le lien</button>
            </form>
            <div class="link">
                <a href="{{ url_for('auth.login') }}">Retour à la connexion</a>
            </div>
        </div>
    </div>
</body>
</html>
